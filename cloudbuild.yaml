steps:
  # Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/luminary-repo/luminary:$COMMIT_SHA"
      - "."

  # Push image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "us-central1-docker.pkg.dev/$PROJECT_ID/luminary-repo/luminary:$COMMIT_SHA"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - luminary
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/luminary-repo/luminary:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --quiet

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/luminary-repo/luminary:$COMMIT_SHA"
  
options:
  logging: CLOUD_LOGGING_ONLY
